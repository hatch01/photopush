class: Asset
table: assets
database: all
fields:
  id: UuidValue, defaultModel=random_v7
  sha256: String
  localPath: String?
  remoteUrl: String?
  mimeType: String
  byteSize: int
  width: int?
  height: int?
  capturedAt: DateTime?
  originalName: String?
  syncState: String
  createdAt: DateTime, defaultModel=now
indexes:
  assets_sha256_idx:
    fields: sha256
    unique: true
