name: Format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'

      - name: Install dependencies
        run: |
          cd photopush_server && dart pub get
          cd ../photopush_client && dart pub get
          cd ../photopush_flutter && flutter pub get

      - name: Check formatting Server
        working-directory: photopush_server
        run: dart format --set-exit-if-changed .

      - name: Check formatting Client
        working-directory: photopush_client
        run: dart format --set-exit-if-changed .

      - name: Check formatting Flutter
        working-directory: photopush_flutter
        run: dart format --set-exit-if-changed .
