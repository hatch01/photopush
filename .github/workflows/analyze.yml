name: Analyze

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'

      - name: Install dependencies
        run: |
          cd photopush_server && dart pub get
          cd ../photopush_client && dart pub get
          cd ../photopush_flutter && flutter pub get

      - name: Analyze Server
        working-directory: photopush_server
        run: dart analyze --fatal-infos

      - name: Analyze Client
        working-directory: photopush_client
        run: dart analyze --fatal-infos

      - name: Analyze Flutter
        working-directory: photopush_flutter
        run: flutter analyze
